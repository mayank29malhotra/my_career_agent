name: Keep Alive

on:
  schedule:
    - cron: '*/10 * * * *'  # Every 10 minutes (GitHub may delay this)
  workflow_dispatch:  # Allow manual trigger
  push:  # Run on any push to keep workflow active
    branches:
      - main

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Hugging Face Space
        run: |
          echo "Pinging Space at $(date)"
          response=$(curl -sf -w "\n%{http_code}" https://yomayank-carrer-agent.hf.space/ || echo "000")
          http_code=$(echo "$response" | tail -n1)
          echo "HTTP Status: $http_code"
          if [ "$http_code" = "200" ] || [ "$http_code" = "000" ]; then
            echo "✅ Ping successful or space sleeping - this keeps it warm"
          else
            echo "⚠️  Unexpected response: $http_code"
          fi
      
      - name: Keep workflow active
        run: |
          echo "Last run: $(date)" >> $GITHUB_STEP_SUMMARY
          echo "This prevents GitHub from auto-disabling the workflow"
